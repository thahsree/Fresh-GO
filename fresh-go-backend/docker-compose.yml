services:
  postgres:
    image: postgres:16-alpine
    container_name: freshgo-postgres
    restart: always
    environment:
      POSTGRES_USER: freshgo
      POSTGRES_PASSWORD: freshgo_secure_pass
      POSTGRES_DB: freshgo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshgo -d freshgo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshgo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
