services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshgo-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-freshgo}:${POSTGRES_PASSWORD:-freshgo_secure_pass}@postgres:5432/${POSTGRES_DB:-freshgo_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: freshgo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshgo_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-freshgo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshgo -d freshgo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshgo-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
